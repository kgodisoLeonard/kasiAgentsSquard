server.port=8080
spring.application.name=spaza-backend
spring.config.import=optional:file:./usdc-testnet.properties
spaza.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:3000,http://127.0.0.1:3000
xrpl.ws.url=wss://s.altnet.rippletest.net:51233
xrpl.rlusd.issuer=rPT1Sjq2YGrBMTttX4GZHjKu9dyfzbpAYe
usdc.network=${USDC_NETWORK:testnet}
usdc.rpc.url=${USDC_RPC_URL:https://s.altnet.rippletest.net:51234}
# Official Circle USDC on XRPL Testnet. Use USDC_NETWORK=mainnet for production and configure the mainnet issuer separately.
usdc.currency=${USDC_CURRENCY:5553444300000000000000000000000000000000}
usdc.issuer=${USDC_ISSUER:rHuGNhqTG32mfmAvWA8hUyWRLV3tCSwKQt}
# Public Testnet receiving address only; override with USDC_MERCHANT_ADDRESS for any other wallet or mainnet.
usdc.merchant.address=${USDC_MERCHANT_ADDRESS:rwfg8AiiSJmAcNc1anyWyfEqu1QEkmT7y9}
usdc.zar-per-usdc=${USDC_ZAR_PER_USDC:18.00}
agent.daily.limit=5000.00
agent.per.tx.limit=1000.00
spring.datasource.url=jdbc:h2:file:./data/spaza;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
