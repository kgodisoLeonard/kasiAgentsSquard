server.port=8080
spring.application.name=spaza-backend
spaza.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:3000,http://127.0.0.1:3000
xrpl.ws.url=wss://s.altnet.rippletest.net:51233
xrpl.rlusd.issuer=rPT1Sjq2YGrBMTttX4GZHjKu9dyfzbpAYe
agent.daily.limit=5000.00
agent.per.tx.limit=1000.00
# Database. Set SPAZA_DB_URL / SPAZA_DB_USER / SPAZA_DB_PASSWORD to use Supabase Postgres (see run-backend.ps1);
# without them the app falls back to a local H2 file.
spring.datasource.url=${SPAZA_DB_URL:jdbc:h2:file:./data/spaza;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${SPAZA_DB_USER:sa}
spring.datasource.password=${SPAZA_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${SPAZA_DB_POOL:5}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# H2 web console bypasses API auth: off by default. Enable locally only with SPAZA_H2_CONSOLE=true.
spring.h2.console.enabled=${SPAZA_H2_CONSOLE:false}
spring.h2.console.path=/h2-console

# LLM agent (Google AI Studio / Gemini). Set GEMINI_API_KEY in the environment; never commit a key.
spaza.llm.api-key=${GEMINI_API_KEY:}
spaza.llm.model=${GEMINI_MODEL:gemini-2.5-flash}
spaza.llm.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
